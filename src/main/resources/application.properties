spring.application.name=limio-api

# Sem profile ativo, tenta o application-local.yml (gitignored, só existe na máquina de quem desenvolve).
# Sem o arquivo nada muda; deploy e testes definem o próprio profile, então não são afetados.
spring.profiles.default=local

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:limio}
spring.datasource.username=${DB_USERNAME:limio}
spring.datasource.password=${DB_PASSWORD:limio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Branches paralelas criam migrations com número menor que o último já aplicado (ex.: V8 depois
# da V10 no staging). Sem isto o Flyway recusa subir com "resolved migration not applied".
spring.flyway.out-of-order=true

# Storage S3-compatível — preenchido via env STORAGE_BUCKET, STORAGE_ENDPOINT, STORAGE_REGION,
# STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY. Sem STORAGE_BUCKET os beans de S3 não sobem.

# Segredos sem default de propósito: sem a env a aplicação não sobe (placeholder não resolvido),
# em vez de subir em produção com uma chave conhecida por quem tem o código. Testes e
# TestLimioApiApplication usam as chaves de src/test/resources/config/application.properties.

# Chave do HMAC-SHA256 de cpf_bloqueado (com.limio.api.modulos.auth.actions.helper.CpfHasher).
security.cpf.hmac-secret=${CPF_HMAC_SECRET}

# Chave HS256 do token de acesso (com.limio.api.comum.config.JwtConfig), mínimo 32 bytes.
security.jwt.secret=${JWT_SECRET}

# Sessão (TICKET-0032): token de acesso curto + refresh token rotacionado a cada renovação.
auth.token-acesso.validade=${AUTH_TOKEN_ACESSO_VALIDADE:15m}
auth.refresh-token.validade=${AUTH_REFRESH_TOKEN_VALIDADE:30d}

# Rate limit do login: max-falhas senhas erradas pro mesmo e-mail dentro de janela-falhas
# bloqueiam o login por bloqueio (contado da última falha).
auth.login.max-falhas=${AUTH_LOGIN_MAX_FALHAS:5}
auth.login.janela-falhas=${AUTH_LOGIN_JANELA_FALHAS:15m}
auth.login.bloqueio=${AUTH_LOGIN_BLOQUEIO:15m}

# Recuperação de senha (TICKET-0033): token de uso único, válido por validade-token,
# limitado a max-solicitacoes pedidos por conta dentro de janela-solicitacoes.
auth.recuperacao-senha.validade-token=${AUTH_RECUPERACAO_SENHA_VALIDADE_TOKEN:1h}
auth.recuperacao-senha.max-solicitacoes=${AUTH_RECUPERACAO_SENHA_MAX_SOLICITACOES:3}
auth.recuperacao-senha.janela-solicitacoes=${AUTH_RECUPERACAO_SENHA_JANELA_SOLICITACOES:1h}

# Custom URL scheme do app (decisão 2026-10-16: recuperar/alterar senha é só app, sem fallback web,
# então Universal Link não compensa o setup). Formato "limio://", com "//" no final — os usecases só
# concatenam o nome da tela sem barra extra (ex.: "limio://" + "nova-senha?token=..."). Ver
# docs/features/PENDENCIA-universal-link-deeplink-app.md.
app.deeplink.url=${APP_DEEPLINK_URL:limio://}

# Resend (provedor de e-mail transacional, decisão do tech lead no TICKET-0033).
# Sem default de propósito, como os outros segredos. email.enviar=false fora de
# produção: só loga em vez de chamar a API (dev local e testes não dependem de rede).
email.resend.api-key=${RESEND_API_KEY}
email.resend.remetente=${RESEND_REMETENTE:Limio <no-reply@limio.com.br>}
email.enviar=${EMAIL_ENVIAR:false}

# Retenção/LGPD (TICKET-0034): rotina diária de limpeza — CpfBloqueado já liberado (sem
# validade configurável, é sempre "liberadoEm no passado"), LogAuditoria e Sessao pela
# validade abaixo. Cron em horário de menor tráfego (3h); formato Spring de 6 campos.
auth.retencao.cron=${AUTH_RETENCAO_CRON:0 0 3 * * *}
auth.retencao.log-auditoria.validade=${AUTH_RETENCAO_LOG_AUDITORIA_VALIDADE:1825d}
auth.retencao.sessao.validade=${AUTH_RETENCAO_SESSAO_VALIDADE:180d}

# Confirmação de e-mail (TICKET-0048): token de uso único emitido na troca de e-mail, válido por
# validade-token, limitado a max-solicitacoes emissões por conta dentro de janela-solicitacoes.
# O consumo do link (UC05) ainda não existe: o link enviado não conclui a confirmação.
auth.confirmacao-email.validade-token=${AUTH_CONFIRMACAO_EMAIL_VALIDADE_TOKEN:24h}
auth.confirmacao-email.max-solicitacoes=${AUTH_CONFIRMACAO_EMAIL_MAX_SOLICITACOES:3}
auth.confirmacao-email.janela-solicitacoes=${AUTH_CONFIRMACAO_EMAIL_JANELA_SOLICITACOES:1h}

# Geocodificação (município-base do Prestador, TICKET-0054; endereços do Empregador, TICKET-0050) via
# Nominatim/OpenStreetMap, atrás da porta Geocodificador. Política de uso do
# servidor público: https://operations.osmfoundation.org/policies/nominatim/ — máx. 1 req/s, User-Agent que
# identifique o app, atribuição ao OpenStreetMap, sem autocomplete. URL configurável pra trocar de provedor ou
# apontar pra instância própria sem versão nova.
geocodificacao.nominatim.url=${GEOCODIFICACAO_NOMINATIM_URL:https://nominatim.openstreetmap.org}
geocodificacao.nominatim.user-agent=${GEOCODIFICACAO_NOMINATIM_USER_AGENT:limio-api/0.0.1 (+https://limio.com.br)}
geocodificacao.timeout=${GEOCODIFICACAO_TIMEOUT:5s}

# Foto de perfil (TICKET-0056). tamanho-maximo é o limite da foto (422 FOTO_INVALIDA acima dele);
# o multipart aceita um pouco mais só pra a resposta ser a do cenário da foto, e não um 413 genérico.
perfil.foto.tamanho-maximo=${PERFIL_FOTO_TAMANHO_MAXIMO:5MB}
# Mídia (comum/midia): o bucket é privado, toda foto sai por link assinado que expira. Lê a variável antiga
# PERFIL_FOTO_VALIDADE_LINK se a nova não existir, pra não exigir mudança no deploy.
midia.validade-link=${MIDIA_VALIDADE_LINK:${PERFIL_FOTO_VALIDADE_LINK:1h}}

# Fotos do anúncio (ETI-59). Formato, tamanho e quantidade ainda dependem do PO: por ora JPG/PNG, o mesmo
# tamanho da foto de perfil e até quantidade-maxima fotos ativas por anúncio.
anuncio.foto.tamanho-maximo=${ANUNCIO_FOTO_TAMANHO_MAXIMO:5MB}
anuncio.foto.quantidade-maxima=${ANUNCIO_FOTO_QUANTIDADE_MAXIMA:5}
# Prazo pro Empregador validar o serviço depois do check-out (UC "Criar anúncio": 24h).
anuncio.prazo-validacao-horas=${ANUNCIO_PRAZO_VALIDACAO_HORAS:24}

# max-request-size cobre um envio com todas as fotos do anúncio de uma vez (5 x 5MB, com folga).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}

# CORS do app web (Expo web). Lista separada por vírgula; aceita curinga de porta (http://localhost:*).
# Em staging/produção, definir CORS_ORIGENS_PERMITIDAS com o domínio do app web.
cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:*,http://127.0.0.1:*}

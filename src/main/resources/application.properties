spring.application.name=limio-api

# Sem profile ativo, tenta o application-local.yml (gitignored, só existe na máquina de quem desenvolve).
# Sem o arquivo nada muda; deploy e testes definem o próprio profile, então não são afetados.
spring.profiles.default=local

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:limio}
spring.datasource.username=${DB_USERNAME:limio}
spring.datasource.password=${DB_PASSWORD:limio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Branches paralelas criam migrations com número menor que o último já aplicado (ex.: V8 depois
# da V10 no staging). Sem isto o Flyway recusa subir com "resolved migration not applied".
spring.flyway.out-of-order=true

# Storage S3-compatível — preenchido via env STORAGE_BUCKET, STORAGE_ENDPOINT, STORAGE_REGION,
# STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY. Sem STORAGE_BUCKET os beans de S3 não sobem.

# Segredos sem default de propósito: sem a env a aplicação não sobe (placeholder não resolvido),
# em vez de subir em produção com uma chave conhecida por quem tem o código. Testes e
# TestLimioApiApplication usam as chaves de src/test/resources/config/application.properties.

# Chave do HMAC-SHA256 de cpf_bloqueado (com.limio.api.modulos.auth.actions.helper.CpfHasher).
security.cpf.hmac-secret=${CPF_HMAC_SECRET}

# Chave HS256 do token de acesso (com.limio.api.comum.config.JwtConfig), mínimo 32 bytes.
security.jwt.secret=${JWT_SECRET}

# Sessão (TICKET-0032): token de acesso curto + refresh token rotacionado a cada renovação.
auth.token-acesso.validade=${AUTH_TOKEN_ACESSO_VALIDADE:15m}
auth.refresh-token.validade=${AUTH_REFRESH_TOKEN_VALIDADE:30d}

# Rate limit do login: max-falhas senhas erradas pro mesmo e-mail dentro de janela-falhas
# bloqueiam o login por bloqueio (contado da última falha).
auth.login.max-falhas=${AUTH_LOGIN_MAX_FALHAS:5}
auth.login.janela-falhas=${AUTH_LOGIN_JANELA_FALHAS:15m}
auth.login.bloqueio=${AUTH_LOGIN_BLOQUEIO:15m}
# Mesmo bloqueio por IP do cliente (só IP público — ver IpHelper). Mais alto que o por e-mail: vários usuários
# podem dividir um IP (rede da escola, NAT da operadora). Decisão do tech lead, 2026-10-26.
auth.login.max-falhas-por-ip=${AUTH_LOGIN_MAX_FALHAS_POR_IP:30}

# IP real do cliente atrás do proxy da Railway (decisão do tech lead, 2026-10-26): o RemoteIpValve do Tomcat lê o
# X-Forwarded-For da direita pra esquerda, pulando só proxies internos (10/8, 172.16/12, 192.168/16, 100.64/10,
# loopback...). O primeiro IP de fora é o que o proxy da Railway viu, então um X-Forwarded-For forjado pelo
# cliente (que fica à esquerda) é ignorado. Afeta request.getRemoteAddr(): login, sessão e auditoria.
server.forward-headers-strategy=native

# Recuperação de senha (TICKET-0033): token de uso único, válido por validade-token,
# limitado a max-solicitacoes pedidos por conta dentro de janela-solicitacoes.
auth.recuperacao-senha.validade-token=${AUTH_RECUPERACAO_SENHA_VALIDADE_TOKEN:1h}
auth.recuperacao-senha.max-solicitacoes=${AUTH_RECUPERACAO_SENHA_MAX_SOLICITACOES:3}
auth.recuperacao-senha.janela-solicitacoes=${AUTH_RECUPERACAO_SENHA_JANELA_SOLICITACOES:1h}

# URL pública desta API (TICKET-0047, ADR-0002). Os e-mails de "Nova senha" e "Confirmar e-mail" levam a
# páginas web servidas por ela mesma: <app.web.url>/nova-senha#token=... e /confirmar-email#token=....
# Em staging/produção, definir APP_WEB_URL com o domínio https da API (ex.: https://api.limio.com.br).
app.web.url=${APP_WEB_URL:http://localhost:8080}

# Resend (provedor de e-mail transacional, decisão do tech lead no TICKET-0033).
# Sem default de propósito, como os outros segredos. email.enviar=false fora de
# produção: só loga em vez de chamar a API (dev local e testes não dependem de rede).
email.resend.api-key=${RESEND_API_KEY}
email.resend.remetente=${RESEND_REMETENTE:Limio <no-reply@limio.com.br>}
email.enviar=${EMAIL_ENVIAR:false}

# Retenção/LGPD (TICKET-0034): rotina diária de limpeza — CpfBloqueado já liberado (sem
# validade configurável, é sempre "liberadoEm no passado"), LogAuditoria e Sessao pela
# validade abaixo. Cron em horário de menor tráfego (3h); formato Spring de 6 campos.
auth.retencao.cron=${AUTH_RETENCAO_CRON:0 0 3 * * *}
auth.retencao.log-auditoria.validade=${AUTH_RETENCAO_LOG_AUDITORIA_VALIDADE:1825d}
auth.retencao.sessao.validade=${AUTH_RETENCAO_SESSAO_VALIDADE:180d}
# Falhas de login (tentativa_login) só servem ao bloqueio de 15 min; guardadas por 30 dias pra investigar abuso.
auth.retencao.tentativa-login.validade=${AUTH_RETENCAO_TENTATIVA_LOGIN_VALIDADE:30d}

# Confirmação de e-mail (UC05 — TICKET-0048 e TICKET-0047): token de uso único emitido no cadastro, na troca de
# e-mail e no "Reenviar link", válido por validade-token, limitado a max-solicitacoes emissões por conta dentro de
# janela-solicitacoes. Consumido por POST /auth/confirmar-email (página /confirmar-email).
auth.confirmacao-email.validade-token=${AUTH_CONFIRMACAO_EMAIL_VALIDADE_TOKEN:24h}
auth.confirmacao-email.max-solicitacoes=${AUTH_CONFIRMACAO_EMAIL_MAX_SOLICITACOES:3}
auth.confirmacao-email.janela-solicitacoes=${AUTH_CONFIRMACAO_EMAIL_JANELA_SOLICITACOES:1h}

# Geocodificação (município-base do Prestador, TICKET-0054; endereços do Empregador, TICKET-0050) via
# Nominatim/OpenStreetMap, atrás da porta Geocodificador. Política de uso do
# servidor público: https://operations.osmfoundation.org/policies/nominatim/ — máx. 1 req/s, User-Agent que
# identifique o app, atribuição ao OpenStreetMap, sem autocomplete. URL configurável pra trocar de provedor ou
# apontar pra instância própria sem versão nova.
geocodificacao.nominatim.url=${GEOCODIFICACAO_NOMINATIM_URL:https://nominatim.openstreetmap.org}
geocodificacao.nominatim.user-agent=${GEOCODIFICACAO_NOMINATIM_USER_AGENT:limio-api/0.0.1 (+https://limio.com.br)}
geocodificacao.timeout=${GEOCODIFICACAO_TIMEOUT:5s}

# Foto de perfil (TICKET-0056). tamanho-maximo é o limite da foto (422 FOTO_INVALIDA acima dele);
# o multipart aceita um pouco mais só pra a resposta ser a do cenário da foto, e não um 413 genérico.
perfil.foto.tamanho-maximo=${PERFIL_FOTO_TAMANHO_MAXIMO:5MB}
# Mídia (comum/midia): o bucket é privado, toda foto sai por link assinado que expira. Lê a variável antiga
# PERFIL_FOTO_VALIDADE_LINK se a nova não existir, pra não exigir mudança no deploy.
midia.validade-link=${MIDIA_VALIDADE_LINK:${PERFIL_FOTO_VALIDADE_LINK:1h}}

# Cota do mês do Prestador FREE (ETI-79): quantas escolhas ele pode consumir por mês. Cada mês guarda o teto que
# valia quando começou a contar (cota_mensal.teto_aplicado), então mudar aqui só afeta os meses seguintes.
perfil.cota.teto-free=${PERFIL_COTA_TETO_FREE:4}

# Fotos do anúncio (ETI-59). Formato, tamanho e quantidade ainda dependem do PO: por ora JPG/PNG, o mesmo
# tamanho da foto de perfil e até quantidade-maxima fotos ativas por anúncio.
anuncio.foto.tamanho-maximo=${ANUNCIO_FOTO_TAMANHO_MAXIMO:5MB}
anuncio.foto.quantidade-maxima=${ANUNCIO_FOTO_QUANTIDADE_MAXIMA:5}
# Job de expiração de anúncios vencidos sem candidatura (ETI-66): cron de 6 campos e tamanho do lote por execução.
anuncio.expiracao.cron=${ANUNCIO_EXPIRACAO_CRON:0 */5 * * * *}
anuncio.expiracao.lote=${ANUNCIO_EXPIRACAO_LOTE:100}
# Prazo pro Empregador validar o serviço depois do check-out (UC "Criar anúncio": 24h).
anuncio.prazo-validacao-horas=${ANUNCIO_PRAZO_VALIDACAO_HORAS:24}
# Carência pós-reagendamento (RB36): a janela, contada do aceite do reagendamento, em que o
# cancelamento do Empregador vira CanceladoTardio (sem estorno de cota). Não elimina as 24h de antecedência (RB08).
anuncio.carencia-pos-reagendamento-horas=${ANUNCIO_CARENCIA_POS_REAGENDAMENTO_HORAS:24}
# Reagendamento (ETI-99): máximo de reagendamentos ACEITOS por serviço (propostas recusadas, canceladas ou
# expiradas não contam) e prazo da contraparte pra responder, gravado em cada proposta no momento da criação.
anuncio.reagendamento.limite=${ANUNCIO_REAGENDAMENTO_LIMITE:2}
anuncio.reagendamento.prazo-resposta-horas=${ANUNCIO_REAGENDAMENTO_PRAZO_RESPOSTA_HORAS:24}
# Job de expiração das propostas de reagendamento sem resposta no prazo (ETI-99): cron de 6 campos e tamanho do lote
# por execução. Uma proposta vencida só deixa de ser PENDENTE quando o job roda; até lá ninguém consegue respondê-la.
anuncio.reagendamento.expiracao.cron=${ANUNCIO_REAGENDAMENTO_EXPIRACAO_CRON:0 */5 * * * *}
anuncio.reagendamento.expiracao.lote=${ANUNCIO_REAGENDAMENTO_EXPIRACAO_LOTE:100}

# Denúncia (ETI-114). Prazo de análise contado do registro, até o PO definir o valor (o UC não diz). A foto opcional
# segue o mesmo limite e formato das fotos do anúncio (JPG/PNG).
moderacao.denuncia.prazo-analise-horas=${MODERACAO_DENUNCIA_PRAZO_ANALISE_HORAS:72}
moderacao.denuncia.foto.tamanho-maximo=${MODERACAO_DENUNCIA_FOTO_TAMANHO_MAXIMO:5MB}

# max-request-size cobre um envio com todas as fotos do anúncio de uma vez (5 x 5MB, com folga).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}

# CORS do app web (Expo web). Lista separada por vírgula; aceita curinga de porta (http://localhost:*).
# Em staging/produção, definir CORS_ORIGENS_PERMITIDAS com o domínio do app web.
cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:*,http://127.0.0.1:*}

# JSON estrito para inteiros (decisão do tech lead, 2026-10-26): número decimal em campo inteiro responde 400
# VALIDACAO_FALHOU em vez de ser truncado em silêncio (ex.: raio 10.7 virava 10). Vale para a API toda.
spring.jackson.deserialization.accept-float-as-int=false

# Candidatura (ETI-75): cota mensal de escolhas gratuitas por Prestador FREE, mês civil UTC. O
# financeiro/GOLD (modulos.financeiro) ainda é só o esqueleto do TICKET-0044 — até existir, todo
# Prestador é tratado como FREE, então o limite sempre vale.
anuncio.candidatura.max-escolhas-gratuitas=${ANUNCIO_CANDIDATURA_MAX_ESCOLHAS_GRATUITAS:4}

# Assinar o plano GOLD (ETI-81). financeiro.gateway.provedor escolhe o adapter: "simulado" (padrão, dev
# local e testes, sem rede) ou "asaas" (Railway sandbox/produção). GatewayPagamentoSimulado só existe
# com "simulado"; AsaasClient/GatewayPagamentoAsaas/AsaasWebhookController só existem com "asaas" — por
# isso os segredos do Asaas abaixo não têm default e não quebram o build local.
financeiro.gateway.provedor=${FINANCEIRO_GATEWAY_PROVEDOR:simulado}

# Gateway simulado: os tokens abaixo controlam o resultado da cobrança; qualquer outro valor de
# gatewayToken aprova.
financeiro.gateway.token-recusado=${FINANCEIRO_GATEWAY_TOKEN_RECUSADO:tok_recusado}
financeiro.gateway.token-indisponivel=${FINANCEIRO_GATEWAY_TOKEN_INDISPONIVEL:tok_indisponivel}

# Asaas (ETI-81) — só relevante com financeiro.gateway.provedor=asaas. ASAAS_BASE_URL aponta pro
# sandbox (https://api-sandbox.asaas.com/v3) ou produção (https://api.asaas.com/v3); cada
# ambiente Railway define a própria ASAAS_API_KEY (chave do painel correspondente, nunca a mesma chave
# nos dois) e ASAAS_WEBHOOK_TOKEN (gerado ao cadastrar o webhook no painel Asaas, usado pra validar que
# a chamada em /financeiro/gold/webhook/asaas é mesmo do Asaas).
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.api-key=${ASAAS_API_KEY}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN}
asaas.timeout=${ASAAS_TIMEOUT:10s}

# Renovação mensal do GOLD (ETI-85). A rotina cobra o próximo ciclo no cartão salvo quando data_fim_ciclo passa.
# max-tentativas: quantas cobranças recusadas no mesmo ciclo antes de voltar o Prestador para FREE (UC "quantidade
# de tentativas parametrizável"; valor provisório até o PO definir). intervalo-tentativa: espera entre uma recusa (ou
# o gateway sem resposta) e a próxima tentativa. Enquanto tenta, o Prestador segue GOLD.
financeiro.gold.renovacao.cron=${FINANCEIRO_GOLD_RENOVACAO_CRON:0 */15 * * * *}
financeiro.gold.renovacao.lote=${FINANCEIRO_GOLD_RENOVACAO_LOTE:100}
financeiro.gold.renovacao.max-tentativas=${FINANCEIRO_GOLD_RENOVACAO_MAX_TENTATIVAS:3}
financeiro.gold.renovacao.intervalo-tentativa=${FINANCEIRO_GOLD_RENOVACAO_INTERVALO_TENTATIVA:1d}

# Envio dos avisos (ETI-112). O envio sai fora da requisição, num pool próprio; false roda na mesma thread (testes).
notificacao.envio.assincrono=${NOTIFICACAO_ENVIO_ASSINCRONO:true}
notificacao.envio.threads=${NOTIFICACAO_ENVIO_THREADS:4}
notificacao.envio.fila=${NOTIFICACAO_ENVIO_FILA:1000}
# Push pelo Expo Push Service. Mesmo esquema do e-mail: notificacao.push.enviar=false (padrão) só loga, sem rede.
# EXPO_ACCESS_TOKEN é opcional (só se o projeto Expo exigir "enhanced security for push notifications").
notificacao.push.enviar=${NOTIFICACAO_PUSH_ENVIAR:false}
notificacao.push.expo.url=${NOTIFICACAO_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
notificacao.push.expo.access-token=${EXPO_ACCESS_TOKEN:}

# Só no classpath de teste (nunca vai pro jar). Spring Boot carrega classpath:/config/ por cima de
# src/main/resources/application.properties, então só os segredos são sobrescritos aqui.
security.cpf.hmac-secret=test-only-cpf-hmac-secret
security.jwt.secret=test-only-jwt-secret-com-pelo-menos-32-bytes
email.resend.api-key=test-only-resend-api-key

# Testes nunca carregam o application-local.yml (segredos de staging).
spring.profiles.default=test

# Os jobs (ETI-66, ETI-99, ETI-98) não disparam sozinhos nos testes: as stories chamam executar() quando querem.
anuncio.expiracao.cron=-
anuncio.reagendamento.expiracao.cron=-
anuncio.conclusao-silencio.cron=-

# Envio dos avisos (ETI-112) na mesma thread: os stories conferem o envio sem esperar outra thread.
notificacao.envio.assincrono=false
